# PostgreSQL opcional para desarrollo.
# Si ya tienes PostgreSQL instalado, no necesitas Docker: crea la base de datos
# y apunta DATABASE_URL a tu instancia.
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexo-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_dev
    ports:
      - "5432:5432"
    volumes:
      - nexo_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexo_crm_data:
